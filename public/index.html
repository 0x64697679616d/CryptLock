<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>Digital Locker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="login-card" aria-labelledby="page-title">
            <div class="brand-mark" aria-hidden="true">🔐</div>
            <p class="eyebrow">YOUR PRIVATE SPACE</p>
            <h1 id="page-title">Digital Locker</h1>
            <p class="intro">A safe place for the files that matter.</p>

            <div class="auth-form">
                <label for="login-password">Locker password</label>
                <input
                    id="login-password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
                <button class="primary-button" type="button">Unlock your locker</button>
            </div>

            <details class="register-panel">
                <summary>New to Digital Locker? Create a locker</summary>
                <div class="auth-form register-form">
                    <label for="register-password">Choose a password</label>
                    <input
                        id="register-password"
                        name="password"
                        type="password"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                        required
                    >
                    <button class="secondary-button" type="button">Create your locker</button>
                </div>
            </details>

            <p class="privacy-note">Your files stay private and encrypted.</p>
        </section>
    </main>
</body>
</html>
